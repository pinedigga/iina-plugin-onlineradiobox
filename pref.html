<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { padding: 16px; margin: 0; font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color-scheme: light dark; }
    .help { font-size: 11px; opacity: .6; margin-top: 4px; }
    .section { margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="section">
    <label><input type="checkbox" data-type="bool" data-pref-key="open_on_launch" /> Open the station window when IINA starts</label>
  </div>
  <div class="section">
    Your favourites are managed from <b>Plugin ▸ Online Radio Box…</b> — search stations,
    add them with ☆, or paste links from onlineradiobox.com in the Import tab.
    <p class="help">Favourites are stored locally in IINA, not in your onlineradiobox account.</p>
  </div>
</body>
</html>
